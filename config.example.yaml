# OpsPanel 配置示例
#
# 使用方式：复制为 config.yaml 后按需修改，启动时通过 `./opspanel --config config.yaml` 指定。
# 不提供配置文件时使用下述默认值；同名配置也可用环境变量覆盖（前缀 OPSPANEL_，如 OPSPANEL_SERVER_PORT）。
# 注意：config.yaml 可能含敏感信息，已在 .gitignore 中排除，请勿提交。

server:
  host: "0.0.0.0"        # 监听地址；仅本机访问可改为 127.0.0.1
  port: 18080            # 监听端口
  shutdown_timeout: 10   # 优雅关闭超时（秒）
  push_interval: 3       # WebSocket 系统快照推送间隔（秒）
  data_dir: "./data"     # 数据存储目录（SQLite 数据库，建议权限 0700）

log:
  level: "info"          # debug / info / warn / error
  format: "console"      # console / json
