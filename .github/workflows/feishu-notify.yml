name: Feishu Notify All Events

on:
  # 代码相关 - 所有分支
  push:
  pull_request:
    types: [opened, reopened, closed, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  create:
  delete:
  fork:
  public:
  watch:
    types: [started]

  # Issue / Discussion
  issues:
    types: [opened, edited, milestoned, pinned, reopened, closed]
  issue_comment:
    types: [created, deleted]
  discussion:
    types: [created, edited, answered]
  discussion_comment:
    types: [created, deleted]

  # Release
  release:
    types: [published]
  registry_package:
    types: [published]

  # 项目管理
  label:
    types: [created, deleted]
  milestone:
    types: [opened, deleted]
  project:
    types: [created, deleted, reopened]
  project_card:
    types: [created, deleted]
  project_column:
    types: [created, deleted]

  # CI/CD
  check_run:
    types: [rerequested, completed]
  check_suite:
    types: [completed]
  deployment_status:
  status:
  page_build:

  # 安全
  branch_protection_rule:
    types: [created, deleted]

  # 定时推送 GitHub Trending（可选，不需要可删掉）
  schedule:
    - cron: '30 2 * * *'

jobs:
  send-event:
    name: Webhook
    runs-on: ubuntu-latest
    steps:
      - uses: junka/feishu-bot-webhook-action@main
        with:
          webhook: ${{ secrets.FEISHU_BOT_WEBHOOK }}