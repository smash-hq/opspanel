name: Feishu Notify All Events

on:
  # 代码相关 - 所有分支
  push:
  pull_request:
    types: [opened, reopened, closed, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  create:
  delete:
  fork:
  public:
  watch:
    types: [started]

  # Issue / Discussion
  issues:
    types: [opened, edited, milestoned, pinned, reopened, closed]
  issue_comment:
    types: [created, deleted]
  discussion:
    types: [created, edited, answered]
  discussion_comment:
    types: [created, deleted]

  # Release
  release:
    types: [published]
  registry_package:
    types: [published]

  # 项目管理
  label:
    types: [created, deleted]
  milestone:
    types: [opened, deleted]
  project:
    types: [created, deleted, reopened]
  project_card:
    types: [created, deleted]
  project_column:
    types: [created, deleted]

  # CI/CD
  check_run:
    types: [rerequested, completed]
  check_suite:
    types: [completed]
  deployment_status:
  status:
  page_build:

  # 安全
  branch_protection_rule:
    types: [created, deleted]

jobs:
  send-event:
    name: Feishu Webhook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send Feishu Message
        env:
          WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
        run: |
          EVENT="${{ github.event_name }}"
          REPO="${{ github.repository }}"
          ACTOR="${{ github.actor }}"

          COMMIT_MSG="${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}"
          COMMIT_HASH="${{ github.event.head_commit.id || github.event.pull_request.head.sha || 'N/A' }}"
          COMMIT_URL="${{ github.event.head_commit.url || github.event.pull_request.html_url || 'N/A' }}"

          cat > payload.json <<EOF
          {
            "msg_type": "interactive",
            "card": {
              "elements": [
                {
                  "tag": "div",
                  "text": {
                    "content": "**🔔 GitHub Event Notification**\n\n**Event:** ${EVENT}\n**Repository:** ${REPO}\n**Triggered By:** ${ACTOR}\n\n**Commit / PR:**\n${COMMIT_MSG}\n\n**Commit Hash:** ${COMMIT_HASH}\n\n[View Details](${COMMIT_URL})",
                    "tag": "lark_md"
                  }
                }
              ],
              "header": {
                "title": {
                  "content": "📢 GitHub → Feishu",
                  "tag": "plain_text"
                }
              }
            }
          }
          EOF

          curl -X POST -H "Content-Type: application/json" \
            -d @payload.json "$WEBHOOK"